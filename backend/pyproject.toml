[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-agents-backend"
version = "0.1.0"
description = "Evidence-first multi-agent enterprise analytics workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "duckdb>=1.3,<2",
  "sqlglot>=30,<31", "langgraph>=1.2,<2", "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary,pool]>=3.2,<4", "pyyaml>=6,<7", "jieba>=0.42,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
mysql-dormant = ["PyMySQL>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["insight*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires explicitly configured isolated PostgreSQL", "live: makes authorized real model calls"]

[tool.ruff]
extend = "../ruff.toml"
